<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>resumebuilder</title>
</head>

<body>
  <div id="error-display" style="color: red; padding: 20px; white-space: pre-wrap; font-family: monospace;"></div>
  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('error-display').textContent += e.message + '\n' + e.filename + ':' + e.lineno + '\n\n';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('error-display').textContent += 'Promise Error: ' + e.reason + '\n\n';
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
